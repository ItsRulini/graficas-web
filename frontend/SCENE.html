<!DOCTYPE html>
<html lang="en">
<head>
    <title>¡CHAOS!</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="public/styles/SCENE.css">
    <link href="https://fonts.cdnfonts.com/css/new-super-mario-font-u" rel="stylesheet">

    <!-- Fonts Awesome y google para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <div class="gm-config" style="display: none;" id="config-pause"> <!--fondo -->
        <div class="gmc-set">
            <div class="gmc-resume sfx-btn-close"  id="resume-gmc">
                <div class="gmc-play"><i class="fa-solid fa-play"></i></div>
            </div>
            <div class="gmc-img">
                <img src="resources/img/9.png" alt="spiral" id="spiral">
                <img src="resources/img/10.png" alt="stars" id="stars">
                <img src="resources/img/8.png" alt="cinta" id="cinta">
                <img src="resources/img/8.png" alt="cinta" id="cintados">
            </div>
            <div class="gmc-left">
                <div class="gmc-page uno"></div>
                <div class="gmc-page dos"></div>
                <div class="gmc-page tres"></div>
                <div class="gmc-page cuatro"></div>
                <div class="gmc-page cinco"></div>
            </div>
                <div class="gmc-set-aux">
                    <div class="gmc-set-h">
                        <img src="resources/img/settings.png" alt="settings">
                    </div>
                    <div class="gmc-music-sound">
                        <button id="music-btn" class="sfx-btn"><i class="material-symbols-outlined">music_note</i></button>
                        <button id="volume-btn" class="sfx-btn"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                    <!-- <div class="gmc-gamemode" id="gamemode-gmc">
                        <div class="arrow sfx-btn-click" id="prev"><i class="fa-solid fa-caret-left"></i></div>
                        <div class="gmc-display" id="gm-dif">EASY</div>
                        <div class="arrow sfx-btn-click" id="next"><i class="fa-solid fa-caret-right"></i></div>
                    </div> -->
                    <div class="gmc-reload-wrapper sfx-btn" id="reload-gmc">
                        <div class="gmc-reload">
                            <i class="fa-solid fa-rotate-right"></i>
                        </div>
                    </div>
                    <div class="gmc-btns">
                    <a class="gmc-quit-wrapper"  id="quit-gmc" href="index.html">
                        <div class="gmc-quit sfx-normal-btn">
                            <span class="house"><i class="fa-solid fa-house"></i></span>
                            <span>HOME</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <!-- Mensajes de WIN, LOSE -->
    <div class="gmwl-msg wl-display" style="display: none;"> <!--fondo -->
        <div class="gmwl-set">
            <div class="gmwl-close sfx-btn-close">
                <div class="gmwl-accept">x</div>
            </div>
            <div class="gmc-img">
                <!-- <img src="resources/img/paperstar.png" alt="paperstar" id="paperstar">
                <img src="resources/img/10.png" alt="stars" id="stars"> -->
                <img src="resources/img/8.png" alt="cinta" id="cinta">
                <img src="resources/img/8.png" alt="cinta" id="cintados">
            </div>
            <div class="gmc-left">
                <div class="gmc-page uno"></div>
                <div class="gmc-page dos"></div>
                <div class="gmc-page tres"></div>
                <div class="gmc-page cuatro"></div>
                <div class="gmc-page cinco"></div>
            </div>
            <div class="gmwl-set-aux">
                <div class="gmwl-set-h">
                    <img src="resources/img/ulose.png" alt="you lose" id="img-lose">
                    <img src="resources/img/uwin.png" alt="you win" id="img-win" style="display: none;">
                </div>
                <p>Note: Must've been skill issue.</p>
            </div>
        </div>
    </div> 
    <!-- TIMER, objetos recolectados etc -->
    <div class="gm-display">
        <!-- item recolectado -->
        <div class="gm-colect">
            <img src="resources/img/question.png" alt="unknown">
        </div>
        <!-- timer -->
        <div class="gmd-level-name">
            <div class="timer">Timer:</span></div>
            <div class="ndos" id="secs"><span></span></div>
        </div>
        <div class="gmd-level-name">
            <div class="deaths"><i class="fa-solid fa-skull"></i>:</span></div>
            <div class="ndos" id="deaths"><span></span></div>
        </div>
        <div class="gmd-player-stats">

            <div class="p-rank-aux-tj">
                <!-- <p class="rank">RANK</p> -->
                <div class="p-rank-tj">
                    <div class="pr-tj">
                        <i class="fa-solid fa-question"></i>
                    </div>
                </div>
            </div>

            <div class="gmdps-img">
                <!-- mostrar imagen en base a la seleccion de personaje -->
                <img src="resources/img/isabelle.png" alt="player">
            </div>
            <div class="gmdps-details">
                <p>Username</p>
                <div class="d-score">
                    <span><i class="fa-solid fa-star"></i></span>
                    <span id="uscore"></span>
                </div>
            </div>
        </div>
    </div>
    <!-- ITEM QUE RECOLECTO -->
    <!-- <div class="gm-colect-aux">
        <div class="gm-colect">
            <img src="resources/img/question.png" alt="unknown">
        </div>
        <div class="gm-colect-item">
            <span>ITEM COLLECTED:</span>
            <img src="resources/img/fossil_c.png" alt="colected item"> 
        </div>
    </div> -->

    <script src="/socket.io/socket.io.js"></script>  <!--AGREGADO PARA MULTI-->
    
    <script type="module" src="public/js/SCENE_design.js"></script>
    <script type="module" src="public/js/SCENE.js"></script>
    <!-- <script type="module" src="/js/multiplayer.js"></script> -->
    <!-- <script type="module" src="public/js/SCENE_design.js"></script> -->
</body>
</html>
